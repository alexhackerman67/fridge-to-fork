<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fridge to Fork</title>
    <noscript><meta http-equiv="refresh" content="0; url=../"></noscript>
  </head>
  <body>
    <p>Opening <a href="../">Fridge to Fork</a>…</p>
    <script>
      const destination = new URL('../', location.href);
      destination.hash = location.hash || '#recipes';
      document.querySelector('a').href = destination.href;
      async function refreshApp() {
        if (!('serviceWorker' in navigator)) return;
        const registration = await navigator.serviceWorker.getRegistration(destination.href);
        if (!registration) return;
        await registration.update();
        const worker = registration.installing || registration.waiting;
        if (worker && worker.state !== 'activated' && worker.state !== 'redundant') {
          await new Promise(resolve => worker.addEventListener('statechange', () => {
            if (worker.state === 'activated' || worker.state === 'redundant') resolve();
          }));
        }
      }
      Promise.race([refreshApp(), new Promise(resolve => setTimeout(resolve, 10000))])
        .catch(() => {}).finally(() => location.replace(destination.href));
    </script>
  </body>
</html>
